<div
  class="workspace-section"
  *ngFor="
    let group of domainGroups;
    trackBy: trackByDomain
  ">

  <div class="section-header">

    <div class="section-title">

      <lucide-icon
        [img]="group.domainIcon"
        [size]="18">
      </lucide-icon>

      <h2>
        {{ group.domainName }}
      </h2>

    </div>

  </div>

  <div class="workspace-grid">

    <a
      *ngFor="
        let card of group.cards;
        trackBy: trackByCard
      "
      class="workspace-card"
      [routerLink]="card.route">

      <div
        class="card-icon"
        [ngClass]="card.iconClass">

        <lucide-icon
          [img]="card.icon"
          [size]="22">
        </lucide-icon>

      </div>

      <div class="card-content">

        <h3>
          {{ card.title }}
        </h3>

        <p>
          {{ card.description }}
        </p>

      </div>

      <div class="card-arrow">

        <lucide-icon
          [img]="icons.chevronRight"
          [size]="18">
        </lucide-icon>

      </div>

    </a>

  </div>

</div>

<div
  class="empty-state"
  *ngIf="
    !loading &&
    domainGroups.length === 0
  ">

  <h3>
    No Modules Available
  </h3>

  <p>
    You do not have access
    to any modules.
  </p>

</div>
