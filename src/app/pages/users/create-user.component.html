<div class="page">
  <div class="page-header">
    <h1>Create User</h1>
    <p class="muted">Add a new user to the system and assign a role.</p>
  </div>

  <div class="grid">
    <section class="card user-card">
      <div class="card-body">
        <div class="avatar-row">
          <div class="avatar-preview">S</div>
          <div class="avatar-actions">
            <label class="upload-btn">
              <i class="fa-solid fa-upload"></i> Upload
              <input type="file" hidden />
            </label>
            <button class="btn-secondary" type="button">Remove</button>
          </div>
        </div>

        <form (ngSubmit)="create()" class="form-grid">
          <div class="form-group">
            <label>Name</label>
            <input [(ngModel)]="name" name="name" placeholder="Full name" required />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input [(ngModel)]="email" name="email" type="email" placeholder="name@company.com" required />
          </div>

          <div class="form-group">
            <label>Password</label>
            <input [(ngModel)]="password" name="password" type="password" placeholder="Strong password" required />
          </div>

          <div class="form-group">
            <label>Role</label>
            <select [(ngModel)]="role" name="role">
              <option value="user">User</option>
              <option value="admin">Administrator</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
            <button type="submit" class="btn-primary" [disabled]="saving">{{ saving ? 'Saving...' : 'Create User' }}</button>
          </div>
        </form>
      </div>
    </section>

    <aside class="card meta-card">
      <div class="card-body">
        <h3>Details</h3>
        <p class="muted">Optional metadata and quick actions</p>

        <label>Meta Note</label>
        <textarea rows="4" placeholder="Notes about this user"></textarea>

        <div style="height:18px"></div>

        <label>Send welcome email</label>
        <div class="toggle-row">
          <input id="welcome" type="checkbox" /> <label for="welcome">Enable</label>
        </div>
      </div>
    </aside>
  </div>
</div>
