<div class="page">

  <div class="page-header">
    <h1>Create User</h1>
    <p class="muted">
      Create ERP User
    </p>
  </div>

  <div class="grid">

    <section class="card">

      <div class="card-body">

        <form
          (ngSubmit)="save()"
          class="form-grid">

          <!-- First Name -->
          <div class="form-group">
            <label>First Name <span class="required">*</span></label>

            <input
              type="text"
              [(ngModel)]="user.firstName"
              name="firstName"
              placeholder="Enter First Name"
              required>
          </div>

          <!-- Last Name -->
          <div class="form-group">
            <label>Last Name</label>

            <input
              type="text"
              [(ngModel)]="user.lastName"
              name="lastName"
              placeholder="Enter Last Name">
          </div>

          <!-- Display Name -->
          <div class="form-group">
            <label>Display Name <span class="required">*</span></label>

            <input
              type="text"
              [(ngModel)]="user.displayName"
              name="displayName"
              placeholder="Enter Display Name"
              required>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label>Email <span class="required">*</span></label>

            <input
              type="email"
              [(ngModel)]="user.email"
              name="email"
              placeholder="Enter Email"
              required>
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label>Phone</label>

            <input
              type="text"
              [(ngModel)]="user.phone"
              name="phone"
              placeholder="Enter Phone Number">
          </div>

          <!-- Password -->
          <div class="form-group">
            <label>Password <span class="required">*</span></label>

            <input
              type="password"
              [(ngModel)]="user.password"
              name="password"
              placeholder="Enter Password"
              required>
          </div>

          <!-- Active -->
          <div class="form-group checkbox-group">
            <label>

              <input
                type="checkbox"
                [(ngModel)]="user.isActive"
                name="isActive">

              Active User

            </label>
          </div>

          <!-- Buttons -->
          <div class="form-actions">

            <button
              type="button"
              class="btn-secondary"
              (click)="cancel()">

              Cancel

            </button>

            <button
              type="submit"
              class="btn-primary"
              [disabled]="saving">

              {{ saving ? 'Saving...' : 'Save User' }}

            </button>

          </div>

        </form>

      </div>

    </section>

  </div>

</div>
