<!-- sidebar.component.html -->
<aside class="app-sidebar" [class.collapsed]="collapsed">


  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ul>

      <!-- Dashboard -->
      <li class="nav-item">
        <a class="nav-link active" routerLink="/dashboard" routerLinkActive="active"
           (click)="navClick($event)">
          <i class="fa-solid fa-house-chimney nav-icon"></i>
          <span class="nav-label">Dashboard</span>
        </a>
      </li>

      <!-- CRM -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/crm" routerLinkActive="active"
           (click)="navClick($event)">
          <i class="fa-solid fa-chart-pie nav-icon"></i>
          <span class="nav-label">CRM</span>
        </a>
      </li>

      <!-- Customers -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/customers" routerLinkActive="active"
           (click)="navClick($event)">
          <i class="fa-solid fa-users nav-icon"></i>
          <span class="nav-label">Customers</span>
        </a>
      </li>

      <!-- Sales -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/sales" routerLinkActive="active"
           (click)="navClick($event)">
          <i class="fa-solid fa-bag-shopping nav-icon"></i>
          <span class="nav-label">Sales</span>
        </a>
      </li>

      <!-- Purchase -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/purchase" routerLinkActive="active"
           (click)="navClick($event)">
          <i class="fa-solid fa-cart-flatbed nav-icon"></i>
          <span class="nav-label">Purchase</span>
        </a>
      </li>

      <!-- Inventory -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/inventory" routerLinkActive="active"
           (click)="navClick($event)">
          <i class="fa-solid fa-boxes-stacked nav-icon"></i>
          <span class="nav-label">Inventory</span>
          <span class="nav-badge danger">3</span>
        </a>
      </li>

      <!-- Accounting -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/accounting" routerLinkActive="active"
           (click)="navClick($event)">
          <i class="fa-solid fa-landmark nav-icon"></i>
          <span class="nav-label">Accounting</span>
        </a>
      </li>

      <!-- HRM -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/hrm" routerLinkActive="active"
           (click)="navClick($event)">
          <i class="fa-solid fa-id-badge nav-icon"></i>
          <span class="nav-label">HRM</span>
        </a>
      </li>

      <!-- System section -->
      <li><p class="nav-section-title">System</p></li>

      <!-- Analytics -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/analytics" routerLinkActive="active"
           (click)="navClick($event)">
          <i class="fa-solid fa-chart-line nav-icon"></i>
          <span class="nav-label">Analytics</span>
        </a>
      </li>

      <!-- Settings -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/settings" routerLinkActive="active"
           (click)="navClick($event)">
          <i class="fa-solid fa-gear nav-icon"></i>
          <span class="nav-label">Settings</span>
        </a>
      </li>

    </ul>
  </nav>

  <!-- Footer user -->
  <div class="sidebar-footer">
    <div class="footer-avatar">AS</div>
    <div class="sidebar-footer-info">
      <div class="footer-name">Alex Sterling</div>
      <div class="footer-status">
        <span class="dot"></span>
        v2.4.1 Stable
      </div>
    </div>
  </div>

</aside>
