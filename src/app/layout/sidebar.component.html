<aside
  class="app-sidebar"
  [class.collapsed]="collapsed">

  <nav class="sidebar-nav">

    <ul>

      <!-- Dashboard -->

      <li class="nav-item">

        <a
          class="nav-link"
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{
            exact: true
          }"
          (click)="navClick($event)">

          <i
            class="fa-solid fa-chart-line nav-icon">
          </i>

          <span class="nav-label">
            Dashboard
          </span>

        </a>

      </li>

      <!-- Dynamic Workspaces -->

      <li
        *ngFor="
          let workspace
          of workspaces
        "
        class="nav-item">

        <a
          class="nav-link"
          [routerLink]="
            workspace.routeUrl
          "
          routerLinkActive="active"
          (click)="navClick($event)">

          <i
            [class]="
              workspace.workspaceIcon
            ">
          </i>

          <span class="nav-label">

            {{
              workspace.workspaceName
            }}

          </span>

        </a>

      </li>

      <!-- System -->

      <li>

        <p
          class="nav-section-title">

          System

        </p>

      </li>

      <li class="nav-item">

        <a
          class="nav-link"
          routerLink="/dashboard/settings"
          routerLinkActive="active"
          (click)="navClick($event)">

          <i
            class="fa-solid fa-gear nav-icon">
          </i>

          <span class="nav-label">

            Settings

          </span>

        </a>

      </li>

    </ul>

  </nav>

  <div
    class="sidebar-footer">

    <div
      class="footer-avatar">

      {{
        userName.charAt(0)
      }}

    </div>

    <div
      class="sidebar-footer-info">

      <div
        class="footer-name">

        {{ userName }}

      </div>

      <div
        class="footer-status">

        <span
          class="dot">
        </span>

        SmartERP v1.0

      </div>

    </div>

  </div>

</aside>
