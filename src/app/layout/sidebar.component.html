<aside
  class="app-sidebar"
  [class.collapsed]="collapsed">

  <!-- Logo -->

  <div class="sidebar-brand">

    <div class="brand-icon">
      <i class="fa-solid fa-cubes"></i>
    </div>

    <div
      class="brand-text"
      *ngIf="!collapsed">

      SmartERP

    </div>

  </div>

  <!-- Navigation -->

  <nav class="sidebar-nav">

    <ul>

      <!-- Dashboard -->

      <li class="nav-item">

        <a
          class="nav-link"
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{
            exact: true
          }"
          (click)="navClick($event)">

          <i
            class="fa-solid fa-chart-line nav-icon">
          </i>

          <span
            class="nav-label"
            *ngIf="!collapsed">

            Dashboard

          </span>

        </a>

      </li>

      <!-- Dynamic Workspaces -->

      <li
        class="nav-item"
        *ngFor="
          let workspace
          of workspaces;
          trackBy:
          trackByWorkspace
        ">

        <a
          class="nav-link"
          [routerLink]="
            workspace.routeUrl
          "
          routerLinkActive="active"
          (click)="navClick($event)">

          <i
            [class]="
              workspace.workspaceIcon
            ">
          </i>

          <span
            class="nav-label"
            *ngIf="!collapsed">

            {{
              workspace.workspaceName
            }}

          </span>

        </a>

      </li>

    </ul>

  </nav>

  <!-- Footer -->

  <div class="sidebar-footer">

<div class="footer-avatar">

  {{
    userName
      .charAt(0)
      .toUpperCase()
  }}

</div>

    <div
      class="sidebar-footer-info"
      *ngIf="!collapsed">

      <div class="footer-name">

        {{ userName }}

      </div>

      <div class="footer-status">

        <span class="dot">
        </span>

        Online

      </div>

    </div>

  </div>

</aside>
